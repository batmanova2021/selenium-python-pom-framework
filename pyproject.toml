[project]
name = "selenium-python-pom"
version = "0.1.0"
description = "Page Object Model test automation framework for eBay using Selenium WebDriver, PyTest, and Allure"
readme = "README.md"
requires-python = ">=3.12, <3.15"
dependencies = [
    "allure-pytest>=2.16.0",
    "pytest>=9.1.1",
    "pytest-html>=4.2.0",
    "pytest-rerunfailures>=14.0",
    "pytest-xdist>=3.8.0",
    "selenium>=4.49.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pylint>=3.0",
    "pylint-pytest>=1.1.8",
    "ruff>=0.6.0",
]

# ==============================================================
# PyTest
# ==============================================================
[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-v --alluredir=allure-results --html=reports/report.html --self-contained-html"
markers = [
    "smoketest: marks tests as a quick smoke test",
    "regressiontest: marks tests as part of the full regression suite",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# ==============================================================
# Mypy — Static Type Checking
# ==============================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "allure.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "allure_commons.*"
ignore_missing_imports = true

# ==============================================================
# Ruff — Fast Python linter & formatter
# ==============================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "allure-results",
    "allure-report",
    "reports",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH",
    "ERA", "RUF", "PT", "RET", "ARG", "DTZ", "T20", "Q",
]

ignore = [
    "N812",    # Selenium convention: `import expected_conditions as EC`
    "PT011",   # pytest.raises(Exception) too broad
    "PT012",   # pytest.raises block should contain a single statement
    "ARG001",  # unused function argument (pytest fixtures)
    "ARG002",  # unused method argument
    "RET504",  # unnecessary assignment before return
    "RET505",  # superfluous-else-return
    "B008",    # function call in default arg (pytest idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # assert is expected in tests
    "PLR2004",  # magic values in tests
    "T20",      # allow print statements in tests for debugging
    "PT018",    # composite assertions in tests
    "E501",     # long test data lines
]

[tool.ruff.lint.isort]
known-first-party = ["pages", "tests"]
force-sort-within-sections = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"
parametrize-values-type = "list"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ==============================================================
# Pylint — Deeper static analysis
# ==============================================================
[tool.pylint.MAIN]
py-version = "3.12"
jobs = 1
persistent = false

[tool.pylint.FORMAT]
max-line-length = 100
max-module-lines = 1000

[tool.pylint.MESSAGES_CONTROL]
disable = [
    "redefined-outer-name",
    "unused-argument",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "duplicate-code",
    "too-many-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "import-error",
    "not-callable",
    "broad-exception-caught",
]

enable = [
    "unused-import",
    "unused-variable",
    "undefined-variable",
]

[tool.pylint.DESIGN]
max-args = 10
max-locals = 20

[tool.pylint.SIMILARITIES]
min-similarity-lines = 8
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
