name: QA Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Nightly regression at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to execute"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression
          - all

# Cancel in-flight jobs for the same branch/ref when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. Quality Gate: Linting, Formatting, & Static Typing
  # ============================================================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff (lint)
        run: uv run ruff check .

      - name: Run Ruff (format check)
        run: uv run ruff format --check .

      - name: Run Pylint
        run: uv run pylint pages/ tests/ config.py --fail-under=8.0

      - name: Run Mypy (type check)
        run: uv run mypy pages tests config.py

  # ============================================================
  # 2. Browser Tests: Smoke on Push/PR, Regression on Nightly
  # ============================================================
  test:
    name: Run Selenium Tests (${{ matrix.browser }})
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      # Execution for push & pull request: Run smoke tests with flakiness retries
      - name: Run Smoke Tests (Push / Pull Request)
        if: (github.event_name == 'push' || github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'smoke')
        run: uv run pytest -m smoketest --browser=${{ matrix.browser }} --headless --reruns 2 --reruns-delay 1

      # Execution for nightly schedule: Run regression tests with flakiness retries
      - name: Run Regression Tests (Nightly Schedule)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'regression')
        run: uv run pytest -m regressiontest --browser=${{ matrix.browser }} --headless --reruns 2 --reruns-delay 1

      # Execution for manual dispatch when "all" is selected
      - name: Run All Tests (Manual Dispatch - All)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'all'
        run: uv run pytest --browser=${{ matrix.browser }} --headless --reruns 2 --reruns-delay 1

      # ============================================================
      # 3. Report Generation & Publishing
      # ============================================================
      - name: Set up Node.js for Allure CLI
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Allure HTML Report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            npx allure-commandline generate allure-results --clean -o allure-report
          else
            echo "No allure-results found to generate report."
          fi

      - name: Publish PyTest HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report-${{ matrix.browser }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Allure HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report-${{ matrix.browser }}
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Allure Raw Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14
